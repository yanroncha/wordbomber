<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordBomber</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: #0a0a12;
  height: 100%;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
#wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
#game {
  background: #123016;
  box-shadow: 0 0 40px rgba(80, 200, 120, 0.25);
  image-rendering: pixelated;
  max-width: 100vw;
  max-height: 100vh;
  touch-action: none; /* no scroll/pinch while playing */

</style>

<script>
// Keyboard input: held-key state plus one-frame "just pressed" edges.
window.WB = window.WB || {};

WB.Input = (function () {
  var down = {};
  var pressed = {};

  var ALIASES = {
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    Space: 'bomb', KeyZ: 'bomb',
    Enter: 'start',
    KeyP: 'pause', Escape: 'pause',
    KeyR: 'restart',
    KeyM: 'mute'
  };

  function onKey(e, isDown) {
    var name = ALIASES[e.code];
    if (!name) return;
    e.preventDefault();
    // Kick the audio context alive from within the user gesture.
    if (isDown && WB.Audio) WB.Audio.start();
    if (isDown && !down[name]) pressed[name] = true;
    down[name] = isDown;
  }

  return {
    init: function () {
      window.addEventListener('keydown', function (e) { onKey(e, true); });
      window.addEventListener('keyup', function (e) { onKey(e, false); });
      window.addEventListener('blur', function () { down = {}; });
    },
    isDown: function (name) { return !!down[name]; },
    wasPressed: function (name) { return !!pressed[name]; },
    // Synthetic one-frame press, used by the touch UI to emit virtual keys.
    press: function (name) { pressed[name] = true; },
    // Call once at the end of each frame to consume edge events.
    endFrame: function () { pressed = {}; }
  };
})();
</script>
<script>
// Scrolling terrain built from biome zones (forest / plains / desert / sea),
// each with detailed hand-drawn decor. The biome stays constant while a word
// is in progress; completing a word scrolls in the next (different) biome.
window.WB = window.WB || {};

WB.Background = (function () {
  var W = 480, H = 640;
  var BIOMES = ['forest', 'plains', 'desert', 'sea'];
  var BASE = {
    forest: '#14351a',
    plains: '#4a7033',
    desert: '#d4b36a',
    sea: '#1d4e6e'
  };
  var zones = []; // topmost first: {top, h, biome, decors[]}
  var currentBiome = BIOMES[0];

  function rand(a, b) { return a + Math.random() * (b - a); }

  function pickBiome(exclude) {
    var pool = BIOMES.filter(function (b) { return b !== exclude; });
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function makeRockPoints(r) {
    var pts = [];
    var n = 5 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2;
      var rr = r * rand(0.7, 1.2);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return pts;
  }

  function makeZone(top, h, biome) {
    var z = { top: top, h: h, biome: biome, decors: [] };
    var area = W * h;
    var n, i;

    if (biome === 'forest') {
      n = Math.floor(area / 5200);
      for (i = 0; i < n; i++) {
        z.decors.push({ type: 'tree', x: rand(8, W - 8), ry: rand(8, h - 8), r: rand(7, 15) });
      }
      n = Math.floor(area / 26000);
      for (i = 0; i < n; i++) {
        z.decors.push({ type: 'bush', x: rand(6, W - 6), ry: rand(6, h - 6), r: rand(4, 7) });
      }
    } else if (biome === 'plains') {
      n = Math.floor(area / 8500);
      for (i = 0; i < n; i++) {
        z.decors.push({ type: 'grass', x: rand(4, W - 4), ry: rand(4, h - 4), s: rand(4, 8) });
      }
      n = Math.floor(area / 34000);
      for (i = 0; i < n; i++) {
        z.decors.push({ type: 'bush', x: rand(6, W - 6), ry: rand(6, h - 6), r: rand(4, 8) });
      }
      if (Math.random() < 0.65 && h > 180) {
        n = 1 + Math.floor(Math.random() * 2);
        for (i = 0; i < n; i++) {
          var fw = rand(90, 160), fh = rand(70, 120);
          z.decors.push({
            type: 'field', x: rand(20, W - 20 - fw),
            ry: rand(20, Math.max(21, h - 20 - fh)), w: fw, fh: fh
          });
        }
      }
      n = Math.floor(area / 60000);
      for (i = 0; i < n; i++) {
        z.decors.push({ type: 'tree', x: rand(10, W - 10), ry: rand(10, h - 10), r: rand(8, 12) });
      }
    } else if (biome === 'desert') {
      for (var ry = rand(20, 50); ry < h - 15; ry += rand(45, 80)) {
        z.decors.push({ type: 'dune', ry: ry, phase: rand(0, 6.28), amp: rand(4, 9) });
      }
      n = Math.floor(area / 27000);
      for (i = 0; i < n; i++) {
        z.decors.push({ type: 'cactus', x: rand(12, W - 12), ry: rand(14, h - 14), s: rand(0.8, 1.4) });
      }
      n = Math.floor(area / 24000);
      for (i = 0; i < n; i++) {
        z.decors.push({ type: 'rock', x: rand(10, W - 10), ry: rand(10, h - 10), pts: makeRockPoints(rand(5, 10)) });
      }
    } else { // sea
      for (var wy = rand(15, 40); wy < h - 10; wy += rand(30, 46)) {
        z.decors.push({ type: 'wave', ry: wy, phase: rand(0, 10) });
      }
      if (Math.random() < 0.35) {
        z.decors.push({ type: 'island', x: rand(50, W - 50), ry: rand(50, Math.max(51, h - 50)), r: rand(18, 34) });
      }
    }

    // painter's order: things lower on screen draw last (on top)
    z.decors.sort(function (a, b) { return (a.ry || 0) - (b.ry || 0); });
    return z;
  }

  function reset() {
    zones = [];
    currentBiome = BIOMES[Math.floor(Math.random() * BIOMES.length)];
    var y = -900;
    while (y < H + 100) {
      var h = rand(380, 720);
      zones.push(makeZone(y, h, currentBiome));
      y += h;
    }
  }

  // Called when a word is completed: the next biome scrolls in from the top.
  function changeBiome() {
    currentBiome = pickBiome(currentBiome);
    var z = zones[0];
    if (z && z.top < -40) {
      // shrink the topmost (old-biome) zone from its top edge so the new
      // biome starts just above the screen instead of much later
      var shift = -40 - z.top;
      z.top = -40;
      z.h -= shift;
      for (var i = 0; i < z.decors.length; i++) z.decors[i].ry -= shift;
      z.decors = z.decors.filter(function (d) { return (d.ry || 0) >= 0; });
    }
  }

  function update(dt, speed) {
    var dy = speed * dt;
    for (var i = 0; i < zones.length; i++) zones[i].top += dy;
    zones = zones.filter(function (z) { return z.top < H + 10; });
    while (zones.length === 0 || zones[0].top > -80) {
      var h = rand(380, 720);
      var newTop = zones.length ? zones[0].top - h : -80 - h;
      zones.unshift(makeZone(newTop, h, currentBiome));
    }
  }

  // ---- decor painters -------------------------------------------------

  function circle(ctx, x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTree(ctx, x, y, r) {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    circle(ctx, x + 3, y + 3, r);
    ctx.fillStyle = '#0d3d18';
    circle(ctx, x, y, r);
    ctx.fillStyle = '#1b632c';
    circle(ctx, x - r * 0.18, y - r * 0.22, r * 0.72);
    ctx.fillStyle = '#2e8a3e';
    circle(ctx, x - r * 0.32, y - r * 0.38, r * 0.4);
  }

  function drawBush(ctx, x, y, r) {
    ctx.fillStyle = '#245c25';
    circle(ctx, x, y, r);
    circle(ctx, x - r * 0.7, y + r * 0.2, r * 0.7);
    circle(ctx, x + r * 0.7, y + r * 0.2, r * 0.7);
    ctx.fillStyle = '#3b7d36';
    circle(ctx, x - r * 0.2, y - r * 0.25, r * 0.55);
  }

  function drawGrass(ctx, x, y, s) {
    ctx.strokeStyle = '#6f9c4a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x - s * 0.5, y - s);
    ctx.moveTo(x, y); ctx.lineTo(x, y - s * 1.2);
    ctx.moveTo(x, y); ctx.lineTo(x + s * 0.5, y - s);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawField(ctx, x, y, w, h) {
    ctx.fillStyle = '#7a5c33';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    for (var ry = y + 6; ry < y + h - 3; ry += 8) {
      ctx.moveTo(x + 3, ry);
      ctx.lineTo(x + w - 3, ry);
    }
    ctx.stroke();
    ctx.strokeStyle = '#5c4526';
    ctx.strokeRect(x, y, w, h);
  }

  function drawDune(ctx, y, phase, amp) {
    ctx.strokeStyle = 'rgba(255,248,215,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (var px = 0; px <= W; px += 14) {
      var py = y + Math.sin(px * 0.03 + phase) * amp;
      if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    // shaded side of the dune
    ctx.strokeStyle = 'rgba(140,110,55,0.35)';
    ctx.beginPath();
    for (px = 0; px <= W; px += 14) {
      py = y + 3 + Math.sin(px * 0.03 + phase) * amp;
      if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawCactus(ctx, x, y, s) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(x + 3, y + 8 * s, 7 * s, 3 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#39702f';
    // trunk
    ctx.fillRect(x - 2 * s, y - 9 * s, 4 * s, 18 * s);
    // arms
    ctx.fillRect(x - 8 * s, y - 3 * s, 6 * s, 3 * s);
    ctx.fillRect(x - 8 * s, y - 8 * s, 3 * s, 8 * s);
    ctx.fillRect(x + 2 * s, y + 1 * s, 6 * s, 3 * s);
    ctx.fillRect(x + 5 * s, y - 5 * s, 3 * s, 9 * s);
    ctx.fillStyle = '#4f8a3e';
    ctx.fillRect(x - 0.8 * s, y - 9 * s, 1.6 * s, 18 * s);
  }

  function drawRock(ctx, x, y, pts) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var px = x + pts[i][0] + 2, py = y + pts[i][1] + 2;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8d8577';
    ctx.beginPath();
    for (i = 0; i < pts.length; i++) {
      px = x + pts[i][0]; py = y + pts[i][1];
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.stroke();
  }

  function drawWave(ctx, y, phase, time) {
    ctx.strokeStyle = 'rgba(190,230,255,0.4)';
    ctx.lineWidth = 2;
    var off = ((time * 22 + phase * 40) % 120);
    ctx.beginPath();
    for (var px = -120 + off; px < W + 40; px += 120) {
      ctx.moveTo(px, y);
      ctx.quadraticCurveTo(px + 20, y - 6, px + 40, y);
    }
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawIsland(ctx, x, y, r) {
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, r + 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.fillStyle = '#d9c07a';
    circle(ctx, x, y, r);
    ctx.fillStyle = '#3f7a34';
    circle(ctx, x, y, r * 0.55);
    drawTree(ctx, x - r * 0.15, y - r * 0.1, r * 0.3);
  }

  // ---------------------------------------------------------------------

  function drawZone(ctx, z, time) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, z.top - 1, W, z.h + 2);
    ctx.clip();
    ctx.fillStyle = BASE[z.biome];
    ctx.fillRect(0, z.top - 1, W, z.h + 2);

    for (var i = 0; i < z.decors.length; i++) {
      var d = z.decors[i];
      var y = z.top + d.ry;
      if (y < -40 || y > H + 40) continue;
      switch (d.type) {
        case 'tree': drawTree(ctx, d.x, y, d.r); break;
        case 'bush': drawBush(ctx, d.x, y, d.r); break;
        case 'grass': drawGrass(ctx, d.x, y, d.s); break;
        case 'field': drawField(ctx, d.x, y, d.w, d.fh); break;
        case 'dune': drawDune(ctx, y, d.phase, d.amp); break;
        case 'cactus': drawCactus(ctx, d.x, y, d.s); break;
        case 'rock': drawRock(ctx, d.x, y, d.pts); break;
        case 'wave': drawWave(ctx, y, d.phase, time); break;
        case 'island': drawIsland(ctx, d.x, y, d.r); break;
      }
    }
    ctx.restore();
  }

  function draw(ctx, time) {
    time = time || 0;
    var i;
    for (i = 0; i < zones.length; i++) drawZone(ctx, zones[i], time);

    // soft blend at each biome boundary
    for (i = 1; i < zones.length; i++) {
      var by = zones[i].top;
      if (by < -20 || by > H + 20) continue;
      var grad = ctx.createLinearGradient(0, by - 14, 0, by + 14);
      grad.addColorStop(0, BASE[zones[i - 1].biome]);
      grad.addColorStop(1, BASE[zones[i].biome]);
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = grad;
      ctx.fillRect(0, by - 14, W, 28);
      ctx.globalAlpha = 1;
    }
  }

  return { reset: reset, update: update, draw: draw, changeBiome: changeBiome };
})();
</script>
<script>
// Target-word logic: word selection, mask (mushikui) generation, and
// candidate-set judging so any dictionary-consistent letter counts as correct.
window.WB = window.WB || {};

WB.WordGame = (function () {
  var answer = '';
  var len = 0;
  var masked = [];     // boolean per position (still hidden from the player?)
  var known = [];      // char or null per position (what the HUD shows)
  var progress = 0;    // letters confirmed this attempt
  var confirmed = [];  // chars bombed so far this attempt
  var candidates = []; // dictionary words consistent with known[] + confirmed[]

  function wordLenForLevel(level) {
    return Math.min(7, 3 + Math.floor((level - 1) / 2));
  }

  function maskCountForLevel(level, wordLen) {
    return Math.min(wordLen - 2, Math.floor((level - 1) / 2));
  }

  function rebuildCandidates() {
    var pool = WB.WORDS[len];
    candidates = pool.filter(function (w) {
      for (var i = 0; i < len; i++) {
        if (i < progress) {
          if (w[i] !== confirmed[i]) return false;
        } else if (known[i] !== null && w[i] !== known[i]) {
          return false;
        }
      }
      return true;
    });
  }

  function newWord(level) {
    len = wordLenForLevel(level);
    var pool = WB.WORDS[len];
    answer = pool[Math.floor(Math.random() * pool.length)];

    var idx = [];
    for (var i = 0; i < len; i++) idx.push(i);
    for (var j = idx.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
    }
    var mc = maskCountForLevel(level, len);
    masked = [];
    known = [];
    for (i = 0; i < len; i++) { masked.push(false); known.push(answer[i]); }
    for (i = 0; i < mc; i++) { masked[idx[i]] = true; known[idx[i]] = null; }

    progress = 0;
    confirmed = [];
    rebuildCandidates();
  }

  // Returns {correct, complete, wasMasked, word}
  function bomb(letter) {
    var ok = candidates.some(function (w) { return w[progress] === letter; });
    if (!ok) return { correct: false, complete: false, wasMasked: false, word: null };

    var wasMasked = masked[progress] && known[progress] === null;
    confirmed.push(letter);
    known[progress] = letter; // reveal (stays revealed even after a miss reset)
    progress++;
    rebuildCandidates();

    if (progress === len) {
      return { correct: true, complete: true, wasMasked: wasMasked, word: confirmed.join('') };
    }
    return { correct: true, complete: false, wasMasked: wasMasked, word: null };
  }

  // After a miss: restart the current word, keeping any revealed letters.
  function resetProgress() {
    progress = 0;
    confirmed = [];
    rebuildCandidates();
  }

  // Letters the spawner must keep supplying: every candidate's next letter.
  function neededLetters() {
    var set = {};
    for (var i = 0; i < candidates.length; i++) set[candidates[i][progress]] = true;
    return Object.keys(set);
  }

  function getDisplay() {
    var out = [];
    for (var i = 0; i < len; i++) {
      out.push({
        char: known[i] === null ? '_' : known[i],
        done: i < progress,
        current: i === progress,
        hidden: known[i] === null
      });
    }
    return out;
  }

  return {
    newWord: newWord,
    bomb: bomb,
    resetProgress: resetProgress,
    neededLetters: neededLetters,
    getDisplay: getDisplay,
    getLength: function () { return len; },
    getProgress: function () { return progress; }
  };
})();
</script>
<script>
// Turret spawner: keeps the letters the player needs flowing in,
// mixed with decoys, so a word can never dead-end.
window.WB = window.WB || {};

WB.Spawner = (function () {
  var W = 480, H = 640;
  var ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var turrets = [];
  var timer = 0;
  var sinceNeeded = 0; // spawns since we last guaranteed a needed letter

  function interval(level) {
    return Math.max(0.5, 1.25 - level * 0.06);
  }

  function pickX() {
    for (var tries = 0; tries < 8; tries++) {
      var x = 40 + Math.random() * (W - 80);
      var ok = true;
      for (var i = 0; i < turrets.length; i++) {
        var t = turrets[i];
        if (t.y < 60 && Math.abs(t.x - x) < 60) { ok = false; break; }
      }
      if (ok) return x;
    }
    return 40 + Math.random() * (W - 80);
  }

  function neededOnScreen() {
    var needed = WB.WordGame.neededLetters();
    for (var i = 0; i < turrets.length; i++) {
      var t = turrets[i];
      if (t.alive && t.letter && t.y < H * 0.75 && needed.indexOf(t.letter) >= 0) return true;
    }
    return false;
  }

  function spawnOne() {
    var letter;
    var needed = WB.WordGame.neededLetters();
    var mustSupply = sinceNeeded >= 2 || !neededOnScreen();

    if (mustSupply && needed.length > 0) {
      letter = needed[Math.floor(Math.random() * needed.length)];
      sinceNeeded = 0;
    } else if (Math.random() < 0.15) {
      letter = null; // blank bunker
      sinceNeeded++;
    } else {
      letter = ALPHABET[Math.floor(Math.random() * 26)];
      sinceNeeded++;
    }
    turrets.push(new WB.Turret(pickX(), -30, letter));
  }

  function reset() {
    turrets = [];
    timer = 0.2;
    sinceNeeded = 99; // force a needed letter immediately
  }

  function update(dt, level, scrollSpeed) {
    timer -= dt;
    if (timer <= 0) {
      spawnOne();
      timer = interval(level);
    }
    for (var i = 0; i < turrets.length; i++) turrets[i].update(dt, scrollSpeed);
    turrets = turrets.filter(function (t) { return !t.isGone(H); });
  }

  function draw(ctx) {
    for (var i = 0; i < turrets.length; i++) turrets[i].draw(ctx);
  }

  return {
    reset: reset,
    update: update,
    draw: draw,
    getTurrets: function () { return turrets; }
  };
})();
</script>
<script>
// Ground turret entity: a dome with an engraved letter (or a blank bunker).
window.WB = window.WB || {};

WB.Turret = function (x, y, letter) {
  this.x = x;
  this.y = y;
  this.letter = letter; // null = blank bunker (no penalty, small score)
  this.r = 20;
  this.alive = true;
  this.deadTimer = 0;   // wreck fade-out
  this.angle = Math.random() * Math.PI * 2;
  this.fireTimer = 2.5 + Math.random() * 3; // seconds until first shot
};

WB.Turret.prototype.update = function (dt, scrollSpeed) {
  this.y += scrollSpeed * dt;
  this.angle += dt * 0.8;
  if (!this.alive) this.deadTimer += dt;
};

WB.Turret.prototype.isGone = function (H) {
  return this.y > H + 40 || (!this.alive && this.deadTimer > 0.6);
};

WB.Turret.prototype.hitBy = function (bx, by, blastR) {
  if (!this.alive) return false;
  var dx = this.x - bx, dy = this.y - by;
  return dx * dx + dy * dy <= (this.r + blastR) * (this.r + blastR);
};

WB.Turret.prototype.draw = function (ctx) {
  var x = this.x, y = this.y;

  if (!this.alive) {
    var a = Math.max(0, 1 - this.deadTimer / 0.6);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(x, y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    return;
  }

  // base plate
  ctx.fillStyle = '#4a4a52';
  ctx.fillRect(x - this.r - 4, y - this.r - 4, (this.r + 4) * 2, (this.r + 4) * 2);
  ctx.strokeStyle = '#6a6a72';
  ctx.strokeRect(x - this.r - 4, y - this.r - 4, (this.r + 4) * 2, (this.r + 4) * 2);

  // rotating barrel (decorative — turrets never fire)
  ctx.strokeStyle = '#8a8a92';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + Math.cos(this.angle) * (this.r + 8), y + Math.sin(this.angle) * (this.r + 8));
  ctx.stroke();
  ctx.lineWidth = 1;

  // dome
  ctx.fillStyle = this.letter ? '#7d3030' : '#555c66';
  ctx.beginPath();
  ctx.arc(x, y, this.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.arc(x, y, this.r - 3, -2.4, -0.6);
  ctx.stroke();

  if (this.letter) {
    ctx.fillStyle = '#ffe9a8';
    ctx.font = 'bold 22px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.letter, x, y + 1);
  }
};
</script>
<script>
// Player ship: 4-way movement clamped on screen, with a bombing reticle ahead.
// Freighter-style saucer hull (a nod to a certain famous ship): twin forward
// mandibles, offset cockpit, radar dish. Banks visually when strafing.
// Takes damage from enemy fire; brief invulnerability + blink after a hit.
window.WB = window.WB || {};

WB.Player = (function () {
  var W = 480, H = 640;
  var SPEED = 260;
  var RETICLE_DIST = 130;
  var RADIUS = 13;
  var INVULN = 1.6; // seconds of invulnerability after being hit
  var x, y, invuln, tilt;
  var touchTilt = 0, touchTiltTimer = 0; // banking driven by drag input

  // Vertical range: mid-screen down to near the bottom, so the ship and
  // its reticle both stay on screen.
  var MIN_Y = H * 0.35;
  var MAX_Y = H - 50;

  function reset() {
    x = W / 2;
    y = H - 90;
    invuln = 0;
    tilt = 0;
    touchTilt = 0;
    touchTiltTimer = 0;
  }

  function clampPos() {
    if (x < 24) x = 24;
    if (x > W - 24) x = W - 24;
    if (y < MIN_Y) y = MIN_Y;
    if (y > MAX_Y) y = MAX_Y;
  }

  // Relative move from the touch UI (drag steering). dx/dy in canvas px.
  function moveBy(dx, dy) {
    x += dx;
    y += dy;
    clampPos();
    touchTilt = Math.max(-0.5, Math.min(0.5, dx * 0.09));
    touchTiltTimer = 0.15;
  }

  function hit() {
    invuln = INVULN;
  }

  // Blink (and stay untouchable) for the duration of a level-up warp.
  function startWarp(duration) {
    invuln = Math.max(invuln, duration);
  }

  function isInvulnerable() {
    return invuln > 0;
  }

  function update(dt) {
    if (invuln > 0) invuln -= dt;
    var dx = 0, dy = 0;
    if (WB.Input.isDown('left')) dx -= 1;
    if (WB.Input.isDown('right')) dx += 1;
    if (WB.Input.isDown('up')) dy -= 1;
    if (WB.Input.isDown('down')) dy += 1;

    // bank into horizontal motion, level off when not strafing;
    // recent drag input takes over the bank target
    var targetTilt;
    if (touchTiltTimer > 0) {
      touchTiltTimer -= dt;
      targetTilt = touchTilt;
    } else {
      targetTilt = dx * 0.5;
    }
    tilt += (targetTilt - tilt) * Math.min(1, dt * 8);

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
    x += dx * SPEED * dt;
    y += dy * SPEED * dt;
    clampPos();
  }

  function reticlePos() {
    return { x: x, y: y - RETICLE_DIST };
  }

  function drawHull(ctx, time) {
    // engine glow strip (rear)
    var g = 0.55 + Math.sin(time * 26) * 0.25;
    ctx.fillStyle = 'rgba(120,190,255,' + g.toFixed(3) + ')';
    ctx.fillRect(-9, 14, 18, 4);
    ctx.fillStyle = 'rgba(190,225,255,' + (g * 0.6).toFixed(3) + ')';
    ctx.fillRect(-7, 18, 14, 2);

    ctx.strokeStyle = '#6b7480';

    // twin forward mandibles
    ctx.fillStyle = '#c9d1d9';
    ctx.beginPath();
    ctx.moveTo(-11, -8);
    ctx.lineTo(-11, -22);
    ctx.lineTo(-9, -26);
    ctx.lineTo(-4, -26);
    ctx.lineTo(-4, -8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(11, -8);
    ctx.lineTo(11, -22);
    ctx.lineTo(9, -26);
    ctx.lineTo(4, -26);
    ctx.lineTo(4, -8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // dark bay between the mandibles
    ctx.fillStyle = '#2a2e33';
    ctx.fillRect(-4, -25, 8, 15);

    // saucer body
    ctx.fillStyle = '#c9d1d9';
    ctx.beginPath();
    ctx.ellipse(0, 3, 15, 13, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // central maintenance trench running back from the bay
    ctx.fillStyle = '#59616b';
    ctx.fillRect(-2.5, -10, 5, 14);
    ctx.strokeStyle = 'rgba(40,45,50,0.6)';
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(0, 4);
    ctx.stroke();

    // hull panel lines
    ctx.strokeStyle = 'rgba(90,100,110,0.75)';
    ctx.beginPath();
    ctx.arc(0, 3, 10, Math.PI * 0.55, Math.PI * 0.95);
    ctx.arc(0, 3, 10, Math.PI * 1.55, Math.PI * 1.95);
    ctx.moveTo(-13, 6); ctx.lineTo(-6, 9);
    ctx.moveTo(13, 6); ctx.lineTo(6, 9);
    ctx.stroke();

    // rear vents
    ctx.fillStyle = '#59616b';
    ctx.fillRect(-8, 10, 4, 3);
    ctx.fillRect(-2, 11, 4, 3);
    ctx.fillRect(4, 10, 4, 3);

    // radar dish (left of the trench)
    ctx.fillStyle = '#aab4bd';
    ctx.beginPath();
    ctx.arc(-7, -1, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6b7480';
    ctx.stroke();
    ctx.fillStyle = '#59616b';
    ctx.beginPath();
    ctx.arc(-7, -1, 1.2, 0, Math.PI * 2);
    ctx.fill();

    // offset cockpit tube on the starboard side
    ctx.fillStyle = '#c9d1d9';
    ctx.beginPath();
    ctx.moveTo(9, 0);
    ctx.lineTo(15, 3);
    ctx.lineTo(16, 7);
    ctx.lineTo(11, 9);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#6b7480';
    ctx.stroke();
    ctx.fillStyle = '#7fa8c9';
    ctx.beginPath();
    ctx.arc(13.5, 5.5, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,45,50,0.7)';
    ctx.beginPath();
    ctx.moveTo(10.5, 4.5); ctx.lineTo(16.5, 6.5);
    ctx.stroke();
  }

  function draw(ctx, time) {
    // reticle
    var r = reticlePos();
    var pulse = 10 + Math.sin(time * 8) * 2;
    ctx.strokeStyle = '#ff5a5a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(r.x, r.y, pulse, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r.x - pulse - 5, r.y); ctx.lineTo(r.x - pulse + 3, r.y);
    ctx.moveTo(r.x + pulse - 3, r.y); ctx.lineTo(r.x + pulse + 5, r.y);
    ctx.moveTo(r.x, r.y - pulse - 5); ctx.lineTo(r.x, r.y - pulse + 3);
    ctx.moveTo(r.x, r.y + pulse - 3); ctx.lineTo(r.x, r.y + pulse + 5);
    ctx.stroke();
    ctx.lineWidth = 1;

    // blink while invulnerable (skip drawing on alternating frames)
    if (invuln > 0 && Math.floor(time * 20) % 2 === 0) return;

    ctx.save();
    ctx.translate(x, y);
    // banking: slight roll + horizontal squash sells the tilt top-down
    ctx.rotate(tilt * 0.35);
    ctx.scale(1 - Math.abs(tilt) * 0.4, 1);
    drawHull(ctx, time);
    ctx.restore();
  }

  return {
    reset: reset,
    update: update,
    draw: draw,
    hit: hit,
    moveBy: moveBy,
    startWarp: startWarp,
    isInvulnerable: isInvulnerable,
    reticlePos: reticlePos,
    getRadius: function () { return RADIUS; },
    getPos: function () { return { x: x, y: y }; }
  };
})();
</script>
<script>
// Bombs (lobbed at the reticle point) and explosion particles.
window.WB = window.WB || {};

WB.Bombs = (function () {
  var FLIGHT = 0.4;   // seconds from release to impact
  var BLAST_R = 26;
  var COOLDOWN = 0.28;
  var MAX_IN_FLIGHT = 2;

  var bombs = [];      // {sx, sy, tx, ty, t}
  var particles = [];  // {x, y, vx, vy, life, max, color, size}
  var cooldown = 0;

  function reset() {
    bombs = [];
    particles = [];
    cooldown = 0;
  }

  function tryDrop() {
    if (cooldown > 0 || bombs.length >= MAX_IN_FLIGHT) return;
    var p = WB.Player.getPos();
    var r = WB.Player.reticlePos();
    bombs.push({ sx: p.x, sy: p.y - 10, tx: r.x, ty: r.y, t: 0 });
    cooldown = COOLDOWN;
  }

  function explodeAt(x, y) {
    for (var i = 0; i < 26; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 40 + Math.random() * 160;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: 0.35 + Math.random() * 0.35,
        color: Math.random() < 0.5 ? '#ffb347' : (Math.random() < 0.5 ? '#ff6b35' : '#ffe66d'),
        size: 2 + Math.random() * 4
      });
    }
  }

  // onImpact(x, y, blastRadius) is called for each bomb that lands.
  function update(dt, onImpact) {
    cooldown -= dt;
    var landed = [];
    for (var i = 0; i < bombs.length; i++) {
      var b = bombs[i];
      b.t += dt;
      if (b.t >= FLIGHT) landed.push(b);
    }
    bombs = bombs.filter(function (b) { return b.t < FLIGHT; });
    for (i = 0; i < landed.length; i++) {
      explodeAt(landed[i].tx, landed[i].ty);
      onImpact(landed[i].tx, landed[i].ty, BLAST_R);
    }

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92;
      p.vy *= 0.92;
    }
    particles = particles.filter(function (p) { return p.life < p.max; });
  }

  function draw(ctx) {
    var i;
    for (i = 0; i < bombs.length; i++) {
      var b = bombs[i];
      var k = b.t / FLIGHT;
      var x = b.sx + (b.tx - b.sx) * k;
      var y = b.sy + (b.ty - b.sy) * k;
      var scale = 1 - k * 0.55; // shrinks as it falls toward the ground

      // ground shadow closing on the impact point
      ctx.fillStyle = 'rgba(0,0,0,' + (0.15 + k * 0.25) + ')';
      ctx.beginPath();
      ctx.ellipse(b.tx, b.ty, 10 * (1 - k) + 4, 5 * (1 - k) + 2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2b2b33';
      ctx.beginPath();
      ctx.arc(x, y, 6 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#888';
      ctx.fillRect(x - 1.5 * scale, y - 9 * scale, 3 * scale, 4 * scale);
    }

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = 1 - p.life / p.max;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * a + 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  return { reset: reset, tryDrop: tryDrop, update: update, draw: draw, explodeAt: explodeAt };
})();
</script>
<script>
// Enemy fire: slow shells lobbed by ground turrets toward the player.
window.WB = window.WB || {};

WB.EnemyFire = (function () {
  var W = 480, H = 640;
  var bullets = []; // {x, y, vx, vy}
  var R = 5;

  var MAX = 5; // global cap so many turrets can't create a bullet storm

  function reset() {
    bullets = [];
  }

  function atCapacity() {
    return bullets.length >= MAX;
  }

  // Wipe every shell currently in flight (used on word completion).
  function clear() {
    bullets = [];
  }

  function bulletSpeed(level) {
    return Math.min(150, 80 + level * 5);
  }

  // Fire from (sx, sy) aimed at the player's current position.
  function spawn(sx, sy, tx, ty, level) {
    var dx = tx - sx, dy = ty - sy;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var sp = bulletSpeed(level);
    bullets.push({ x: sx, y: sy, vx: (dx / d) * sp, vy: (dy / d) * sp });
  }

  // onHit(x, y) is called when a bullet reaches the (vulnerable) player.
  function update(dt, playerPos, playerRadius, invulnerable, onHit) {
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (!invulnerable) {
        var dx = b.x - playerPos.x, dy = b.y - playerPos.y;
        var rr = R + playerRadius;
        if (dx * dx + dy * dy <= rr * rr) {
          b.dead = true;
          onHit(b.x, b.y);
        }
      }
    }
    bullets = bullets.filter(function (b) {
      return !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20;
    });
  }

  function draw(ctx) {
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      ctx.fillStyle = '#ff8a3d';
      ctx.beginPath();
      ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,230,120,0.9)';
      ctx.beginPath();
      ctx.arc(b.x, b.y, R * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  return { reset: reset, spawn: spawn, update: update, draw: draw, atCapacity: atCapacity, clear: clear };
})();
</script>
<script>
// Tiny WebAudio synth: a looping two-note "piro-piro" BGM plus one-shot
// sound effects (turret destroyed, shell hitting the ship). No assets.
window.WB = window.WB || {};

WB.Audio = (function () {
  var ctx = null;
  var master = null;
  var musicGain = null;
  var enabled = true;
  var started = false;

  // BGM sequencer state
  var bgmTimer = 0;    // seconds until next note
  var bgmStep = 0;
  // A monotonous loop: high piro-piro, then low piro-piro.
  var MELODY = [
    880, 1174, 880, 1174,   // ピロピロ (high)
    440, 587, 440, 587      // ピロピロ (low)
  ];
  var NOTE_LEN = 0.16; // seconds per step

  function ensure() {
    if (ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { enabled = false; return false; }
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = 0.16;
      musicGain.connect(master);
    } catch (e) { enabled = false; return false; }
    return true;
  }

  // Must be called from a user gesture (key press) to satisfy autoplay policy.
  function start() {
    if (!enabled || started) return;
    if (!ensure()) return;
    if (ctx.state === 'suspended') ctx.resume();
    started = true;
  }

  function blip(freq, dur, type, gain, dest) {
    if (!ctx) return;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    var t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(dest || master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  function noise(dur, gain, filterFreq) {
    if (!ctx) return;
    var n = Math.floor(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, n, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = filterFreq || 1200;
    var g = ctx.createGain();
    g.gain.value = gain;
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start();
  }

  // ---- one-shot SFX ---------------------------------------------------

  function sfxDestroy() {
    if (!started) return;
    // short descending zap + a noise burst = turret blowing up
    blip(320, 0.14, 'square', 0.35);
    blip(160, 0.2, 'sawtooth', 0.3);
    noise(0.22, 0.35, 900);
  }

  function sfxHit() {
    if (!started) return;
    // dull thud: the ship taking a shell
    blip(140, 0.16, 'triangle', 0.4);
    noise(0.14, 0.4, 500);
  }

  function sfxFanfare() {
    if (!started || !ctx) return;
    // short rising fanfare on word completion: C-E-G-C arpeggio
    var notes = [523, 659, 784, 1046];
    var step = 0.09;
    for (var i = 0; i < notes.length; i++) {
      var osc = ctx.createOscillator();
      var g = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = notes[i];
      var t = ctx.currentTime + i * step;
      var dur = (i === notes.length - 1) ? 0.32 : 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.4, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      g.connect(master);
      osc.start(t);
      osc.stop(t + dur + 0.02);
    }
  }

  function sfxWarp() {
    if (!started || !ctx) return;
    var t = ctx.currentTime;
    // main rising sweep (~2s, matching the warp scroll)
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(1400, t + 1.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28, t + 0.08);
    g.gain.setValueAtTime(0.28, t + 1.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + 2.05);
    // shimmering upper layer
    var o2 = ctx.createOscillator();
    var g2 = ctx.createGain();
    o2.type = 'square';
    o2.frequency.setValueAtTime(240, t);
    o2.frequency.exponentialRampToValueAtTime(2800, t + 1.6);
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.1, t + 0.12);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
    o2.connect(g2); g2.connect(master);
    o2.start(t); o2.stop(t + 1.95);
  }

  // ---- looping BGM ----------------------------------------------------

  function update(dt) {
    if (!started || !enabled) return;
    bgmTimer -= dt;
    while (bgmTimer <= 0) {
      var f = MELODY[bgmStep % MELODY.length];
      blip(f, NOTE_LEN * 0.9, 'square', 0.5, musicGain);
      bgmStep++;
      bgmTimer += NOTE_LEN;
    }
  }

  function setEnabled(v) {
    enabled = v;
    if (master) master.gain.value = v ? 0.5 : 0;
  }

  function toggleMute() {
    setEnabled(!enabled);
    return !enabled; // true when now muted
  }

  return {
    start: start,
    update: update,
    sfxDestroy: sfxDestroy,
    sfxHit: sfxHit,
    sfxFanfare: sfxFanfare,
    sfxWarp: sfxWarp,
    setEnabled: setEnabled,
    toggleMute: toggleMute,
    isEnabled: function () { return enabled; }
  };
})();
</script>
<script>
// Touch UI: drag-relative ship steering plus on-screen bomb / pause / mute
// controls. Appears on the first touch (or on coarse-pointer devices from the
// start) and hides again as soon as a keyboard key is pressed, so PC and
// smartphone switch dynamically with no explicit setting.
window.WB = window.WB || {};

WB.Touch = (function () {
  var W = 480, H = 640;
  var active = false;
  var canvas = null;
  var MOVE_GAIN = 1.45; // finger delta -> ship delta

  // on-canvas controls (canvas coordinates)
  var BOMB = { x: 422, y: 578, r: 44 };
  var PAUSE = { x: W - 26, y: 104, r: 20 };
  var MUTE = { x: W - 26, y: 150, r: 20 };
  // pause-screen tap buttons
  var RESUME_RECT = { x: W / 2 - 100, y: 385, w: 200, h: 50 };
  var RESTART_RECT = { x: W / 2 - 100, y: 455, w: 200, h: 50 };

  var touches = {}; // id -> {kind: move|bomb|tapbomb|ui, x, y}
  var bombHeld = false;
  var bombHold = 0;

  function toCanvas(t) {
    var r = canvas.getBoundingClientRect();
    var sw = r.width > 0 ? W / r.width : 1;   // guard: hidden/zero-size layout
    var sh = r.height > 0 ? H / r.height : 1;
    return {
      x: (t.clientX - r.left) * sw,
      y: (t.clientY - r.top) * sh
    };
  }

  function inCircle(p, c) {
    var dx = p.x - c.x, dy = p.y - c.y;
    return dx * dx + dy * dy <= c.r * c.r;
  }

  function inRect(p, rc) {
    return p.x >= rc.x && p.x <= rc.x + rc.w && p.y >= rc.y && p.y <= rc.y + rc.h;
  }

  function gameState() {
    return WB.Game.getState ? WB.Game.getState() : 'title';
  }

  function hasMoveTouch() {
    for (var id in touches) if (touches[id].kind === 'move') return true;
    return false;
  }

  function onStart(e) {
    e.preventDefault();
    active = true;
    WB.Audio.start(); // a touch is also a valid autoplay-unlock gesture
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var p = toCanvas(t);
      var st = gameState();
      var kind = 'move';
      if (st === 'paused') {
        if (inRect(p, RESTART_RECT)) WB.Input.press('restart');
        else WB.Input.press('pause'); // tap anywhere else = resume
        kind = 'ui';
      } else if (inCircle(p, PAUSE)) {
        WB.Input.press('pause');
        kind = 'ui';
      } else if (inCircle(p, MUTE)) {
        WB.Input.press('mute');
        kind = 'ui';
      } else if (inCircle(p, BOMB)) {
        WB.Input.press('bomb');
        bombHeld = true;
        bombHold = 0;
        kind = 'bomb';
      } else if (hasMoveTouch()) {
        WB.Input.press('bomb'); // second finger anywhere = bomb
        kind = 'tapbomb';
      } else {
        WB.Input.press('start'); // starts / retries on title & gameover
      }
      touches[t.identifier] = { kind: kind, x: p.x, y: p.y };
    }
  }

  function onMove(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var tr = touches[t.identifier];
      if (!tr) continue;
      var p = toCanvas(t);
      if (tr.kind === 'move' && gameState() === 'playing') {
        WB.Player.moveBy((p.x - tr.x) * MOVE_GAIN, (p.y - tr.y) * MOVE_GAIN);
      }
      tr.x = p.x;
      tr.y = p.y;
    }
  }

  function onEnd(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      var tr = touches[t.identifier];
      if (tr && tr.kind === 'bomb') bombHeld = false;
      delete touches[t.identifier];
    }
  }

  function init() {
    canvas = document.getElementById('game');
    // coarse pointer (phone/tablet) -> show the touch UI from the start
    if (window.matchMedia && matchMedia('(pointer: coarse)').matches) active = true;
    canvas.addEventListener('touchstart', onStart, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onEnd, { passive: false });
    canvas.addEventListener('touchcancel', onEnd, { passive: false });
    // keyboard use hides the touch UI again (dynamic PC/mobile switching)
    window.addEventListener('keydown', function () { active = false; });
  }

  function update(dt) {
    if (bombHeld) {
      bombHold += dt;
      if (bombHold >= 0.3) { // hold the button for autofire
        bombHold = 0;
        WB.Input.press('bomb');
      }
    }
  }

  // ---- rendering ------------------------------------------------------

  function drawRoundButton(ctx, rc, label) {
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 2;
    ctx.fillRect(rc.x, rc.y, rc.w, rc.h);
    ctx.strokeRect(rc.x, rc.y, rc.w, rc.h);
    ctx.lineWidth = 1;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, rc.x + rc.w / 2, rc.y + rc.h / 2 + 1);
  }

  function draw(ctx) {
    if (!active) return;
    var st = gameState();

    if (st === 'paused') {
      drawRoundButton(ctx, RESUME_RECT, 'タップで再開');
      drawRoundButton(ctx, RESTART_RECT, 'リスタート');
      return;
    }

    // bomb button
    ctx.fillStyle = 'rgba(255,90,90,0.25)';
    ctx.strokeStyle = 'rgba(255,120,120,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(BOMB.x, BOMB.y, BOMB.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.lineWidth = 1;
    ctx.font = '34px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💣', BOMB.x, BOMB.y + 2);

    // pause icon (two bars)
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(PAUSE.x, PAUSE.y, PAUSE.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillRect(PAUSE.x - 7, PAUSE.y - 8, 5, 16);
    ctx.fillRect(PAUSE.x + 2, PAUSE.y - 8, 5, 16);

    // mute icon
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.arc(MUTE.x, MUTE.y, MUTE.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '18px sans-serif';
    ctx.fillText(WB.Audio.isEnabled() ? '🔊' : '🔇', MUTE.x, MUTE.y + 1);
  }

  return {
    init: init,
    update: update,
    draw: draw,
    isActive: function () { return active; }
  };
})();
</script>
<script>
// HUD: score, lives, level, combo, the target word (with mushikui blanks),
// floating notices, and the "word complete" translation banner.
window.WB = window.WB || {};

WB.Hud = (function () {
  var W = 480, H = 640;
  var messages = []; // {text, color, life, max, y}
  var banner = null; // {word, ja, life, max}

  function reset() {
    messages = [];
    banner = null;
  }

  function flash(text, color) {
    messages.push({ text: text, color: color || '#fff', life: 0, max: 1.4, y: 300 });
  }

  // Celebration banner shown when a word is completed.
  function wordComplete(word, ja) {
    banner = { word: word, ja: ja, life: 0, max: 1.9 };
  }

  function update(dt) {
    for (var i = 0; i < messages.length; i++) {
      messages[i].life += dt;
      messages[i].y -= dt * 30;
    }
    messages = messages.filter(function (m) { return m.life < m.max; });
    if (banner) {
      banner.life += dt;
      if (banner.life >= banner.max) banner = null;
    }
  }

  function drawWord(ctx) {
    var disp = WB.WordGame.getDisplay();
    var n = disp.length;
    var bw = Math.min(34, (W - 40) / n - 6);
    var totalW = n * (bw + 6) - 6;
    var x0 = (W - totalW) / 2;
    var y0 = 28;
    ctx.font = 'bold ' + Math.floor(bw * 0.7) + 'px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < n; i++) {
      var d = disp[i];
      var bx = x0 + i * (bw + 6);
      if (d.done) {
        ctx.fillStyle = 'rgba(70,180,90,0.9)';
      } else if (d.current) {
        ctx.fillStyle = 'rgba(255,209,102,0.9)';
      } else {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
      }
      ctx.fillRect(bx, y0, bw, bw * 0.95);
      if (d.current) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx, y0, bw, bw * 0.95);
        ctx.lineWidth = 1;
      }
      ctx.fillStyle = d.done ? '#fff' : (d.current ? '#20232a' : '#e8ecf0');
      var ch = d.char;
      if (d.hidden && !d.done) ch = '?';
      ctx.fillText(ch, bx + bw / 2, y0 + bw * 0.5);
    }
  }

  function drawBanner(ctx) {
    if (!banner) return;
    var t = banner.life / banner.max;
    // scale-in over first 12%, hold, fade out over last 25%
    var scale = t < 0.12 ? (0.6 + 0.4 * (t / 0.12)) : 1;
    var alpha = t > 0.75 ? Math.max(0, 1 - (t - 0.75) / 0.25) : 1;
    var cx = W / 2, cy = 250;

    ctx.save();
    ctx.globalAlpha = alpha;

    // expanding glow ring
    var ringR = 40 + t * 120;
    ctx.strokeStyle = 'rgba(124,242,124,' + (alpha * (1 - t)) + ')';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;

    ctx.translate(cx, cy);
    ctx.scale(scale, scale);

    // panel
    ctx.fillStyle = 'rgba(10,20,14,0.82)';
    ctx.strokeStyle = 'rgba(124,242,124,0.9)';
    ctx.lineWidth = 2;
    var pw = 300, ph = banner.ja ? 96 : 64;
    ctx.fillRect(-pw / 2, -ph / 2, pw, ph);
    ctx.strokeRect(-pw / 2, -ph / 2, pw, ph);
    ctx.lineWidth = 1;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#7cf27c';
    ctx.font = 'bold 34px Consolas, monospace';
    ctx.fillText(banner.word, 0, banner.ja ? -20 : -2);
    if (banner.ja) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px "Yu Gothic", "Meiryo", sans-serif';
      ctx.fillText(banner.ja, 0, 22);
    }
    ctx.restore();
  }

  function drawShipIcon(ctx, x, y) {
    ctx.fillStyle = '#d8dee6';
    ctx.beginPath();
    ctx.moveTo(x, y - 7);
    ctx.lineTo(x + 6, y + 6);
    ctx.lineTo(x, y + 2);
    ctx.lineTo(x - 6, y + 6);
    ctx.closePath();
    ctx.fill();
  }

  function draw(ctx, g) {
    // top bar
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, 78);

    ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#9fe8ff';
    ctx.fillText('SCORE ' + g.score, 10, 16);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd166';
    ctx.fillText('HI ' + g.hiscore, W - 10, 16);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#c0c8d0';
    ctx.fillText('LV ' + g.level, 10, 66);
    if (g.combo > 1) {
      ctx.fillStyle = '#ff9de2';
      ctx.fillText('COMBO x' + g.comboMult().toFixed(1), 70, 66);
    }
    // lives: small ships up to 6, then a compact "x N" counter
    var ly = 66;
    if (g.lives <= 6) {
      for (var l = 0; l < g.lives; l++) {
        drawShipIcon(ctx, W - 14 - l * 18, ly);
      }
    } else {
      drawShipIcon(ctx, W - 14, ly);
      ctx.fillStyle = '#d8dee6';
      ctx.font = 'bold 15px Consolas, monospace';
      ctx.textAlign = 'right';
      ctx.fillText('x' + g.lives, W - 26, ly + 1);
    }

    drawWord(ctx);
    drawBanner(ctx);

    // floating messages
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 24px Consolas, monospace';
    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      ctx.globalAlpha = Math.max(0, 1 - m.life / m.max);
      ctx.fillStyle = m.color;
      ctx.fillText(m.text, W / 2, m.y);
    }
    ctx.globalAlpha = 1;
  }

  return {
    reset: reset,
    flash: flash,
    wordComplete: wordComplete,
    update: update,
    draw: draw
  };
})();
</script>
<script>
// Game state machine and scoring rules.
window.WB = window.WB || {};

WB.Game = (function () {
  var W = 480, H = 640;
  var WORDS_PER_LEVEL = 3;
  var START_LIVES = 8;
  var EXTRA_LIFE_EVERY = 1000; // grant one ship per this many points
  var WARP_TIME = 2.0;   // seconds of fast-forward scroll on level up
  var WARP_SPEED = 5;    // scroll multiplier while warping
  var HISCORE_KEY = 'wordbomber.hiscore';

  var state = 'title'; // title | playing | paused | gameover
  var score = 0, hiscore = 0, lives = START_LIVES, level = 1;
  var wordsCompleted = 0;
  var combo = 0; // consecutive words completed without a miss
  var stateTimer = 0;
  var warpTimer = 0;
  var nextExtraLife = EXTRA_LIFE_EVERY;

  // Single entry point for awarding points; grants extra ships on
  // each EXTRA_LIFE_EVERY threshold crossed.
  function addScore(pts) {
    score += pts;
    while (score >= nextExtraLife) {
      lives++;
      nextExtraLife += EXTRA_LIFE_EVERY;
      WB.Hud.flash('1UP!', '#7cf27c');
    }
  }

  function loadHiscore() {
    try { hiscore = parseInt(localStorage.getItem(HISCORE_KEY), 10) || 0; }
    catch (e) { hiscore = 0; }
  }

  function saveHiscore() {
    try { localStorage.setItem(HISCORE_KEY, String(hiscore)); } catch (e) {}
  }

  function comboMult() {
    return Math.min(3, 1 + 0.5 * combo);
  }

  function scrollSpeed() {
    var base = Math.min(150, 55 + level * 8);
    return warpTimer > 0 ? base * WARP_SPEED : base;
  }

  function fireCooldown() {
    // "Slow" turret fire; a little quicker at higher levels.
    return Math.max(2.6, 4.6 - level * 0.15) + Math.random() * 3;
  }

  function endGame() {
    state = 'gameover';
    stateTimer = 0;
    if (score > hiscore) { hiscore = score; saveHiscore(); }
  }

  function startGame() {
    state = 'playing';
    score = 0; lives = START_LIVES; level = 1;
    wordsCompleted = 0; combo = 0;
    warpTimer = 0;
    nextExtraLife = EXTRA_LIFE_EVERY;
    WB.Background.reset();
    WB.Player.reset();
    WB.Bombs.reset();
    WB.EnemyFire.reset();
    WB.WordGame.newWord(level);
    WB.Spawner.reset();
    WB.Hud.reset();
  }

  function onLetterBombed(letter) {
    var res = WB.WordGame.bomb(letter);
    if (!res.correct) {
      lives--;
      combo = 0;
      WB.WordGame.resetProgress();
      WB.Hud.flash('MISS!', '#ff5a5a');
      if (lives <= 0) endGame();
      return;
    }

    var pts = 100 * level * (res.wasMasked ? 2 : 1);
    addScore(pts);
    WB.Hud.flash('+' + pts, res.wasMasked ? '#ffd166' : '#9fe8ff');

    if (res.complete) {
      var bonus = Math.floor(500 * res.word.length * level * comboMult());
      addScore(bonus);
      combo++;
      wordsCompleted++;
      // Completion celebration: translation banner + a few bursts.
      WB.Hud.wordComplete(res.word, WB.translate(res.word));
      WB.Audio.sfxFanfare(); // short victory fanfare
      WB.EnemyFire.clear(); // clear every shell in flight on completion
      WB.Background.changeBiome(); // next terrain scrolls in with the next word
      WB.Bombs.explodeAt(W / 2, 250);
      WB.Bombs.explodeAt(W / 2 - 90, 250);
      WB.Bombs.explodeAt(W / 2 + 90, 250);
      WB.Hud.flash('+' + bonus, '#7cf27c');
      var newLevel = 1 + Math.floor(wordsCompleted / WORDS_PER_LEVEL);
      if (newLevel > level) {
        level = newLevel;
        // warp to the next area: fast-forward scroll, blinking ship, SFX
        warpTimer = WARP_TIME;
        WB.Player.startWarp(WARP_TIME);
        WB.Audio.sfxWarp();
        WB.Hud.flash('LEVEL ' + level + '!  WARP!', '#ff9de2');
      }
      WB.WordGame.newWord(level);
    }
  }

  function onImpact(x, y, blastR) {
    var turrets = WB.Spawner.getTurrets();
    for (var i = 0; i < turrets.length; i++) {
      var t = turrets[i];
      if (!t.hitBy(x, y, blastR)) continue;
      t.alive = false;
      WB.Audio.sfxDestroy(); // turret destroyed
      if (t.letter) {
        onLetterBombed(t.letter);
        if (state !== 'playing') return;
      } else {
        addScore(50 * level);
        WB.Hud.flash('+' + (50 * level), '#c0c8d0');
      }
    }
  }

  function onPlayerHit(hx, hy) {
    if (WB.Player.isInvulnerable()) return;
    lives--;
    WB.Audio.sfxHit(); // shell hit the ship
    WB.Player.hit();
    WB.Bombs.explodeAt(hx, hy);
    var p = WB.Player.getPos();
    WB.Bombs.explodeAt(p.x, p.y);
    WB.Hud.flash('-1 SHIP', '#ff5a5a');
    if (lives <= 0) endGame();
  }

  function fireTurrets(dt) {
    var turrets = WB.Spawner.getTurrets();
    var pp = WB.Player.getPos();
    for (var i = 0; i < turrets.length; i++) {
      var t = turrets[i];
      if (!t.alive || t.y < 88 || t.y > H - 20) continue;
      t.fireTimer -= dt;
      if (t.fireTimer <= 0) {
        if (!WB.EnemyFire.atCapacity()) WB.EnemyFire.spawn(t.x, t.y, pp.x, pp.y, level);
        t.fireTimer = fireCooldown();
      }
    }
  }

  function update(dt) {
    stateTimer += dt;
    WB.Touch.update(dt);
    if (WB.Input.wasPressed('mute')) {
      var muted = WB.Audio.toggleMute();
      WB.Hud.flash(muted ? 'MUTE' : 'SOUND ON', '#9fe8ff');
    }
    WB.Audio.update(dt); // looping BGM (silent until first key gesture)
    if (state === 'title') {
      WB.Background.update(dt, 40);
      if (WB.Input.wasPressed('bomb') || WB.Input.wasPressed('start')) startGame();
      return;
    }
    if (state === 'paused') {
      if (WB.Input.wasPressed('pause')) state = 'playing';
      else if (WB.Input.wasPressed('restart')) startGame();
      return;
    }
    if (state === 'gameover') {
      WB.Hud.update(dt);
      WB.Bombs.update(dt, function () {});
      if (stateTimer > 0.8 && (WB.Input.wasPressed('bomb') || WB.Input.wasPressed('start'))) {
        startGame();
      }
      return;
    }

    // playing
    if (WB.Input.wasPressed('pause')) { state = 'paused'; stateTimer = 0; return; }
    if (warpTimer > 0) warpTimer = Math.max(0, warpTimer - dt);
    WB.Background.update(dt, scrollSpeed());
    WB.Player.update(dt);
    if (WB.Input.wasPressed('bomb')) WB.Bombs.tryDrop();
    WB.Spawner.update(dt, level, scrollSpeed());
    if (warpTimer <= 0) fireTurrets(dt); // turrets hold fire during warp
    WB.Bombs.update(dt, onImpact);
    WB.EnemyFire.update(dt, WB.Player.getPos(), WB.Player.getRadius(),
      WB.Player.isInvulnerable(), onPlayerHit);
    WB.Hud.update(dt);
  }

  function drawMuteIndicator(ctx) {
    if (WB.Audio.isEnabled()) return;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.font = 'bold 13px Consolas, monospace';
    ctx.fillStyle = '#ff9de2';
    ctx.fillText('🔇 MUTED (M)', 10, H - 8);
  }

  function drawCenterText(ctx, lines) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      ctx.font = ln.font;
      ctx.fillStyle = ln.color;
      ctx.fillText(ln.text, W / 2, ln.y);
    }
  }

  function draw(ctx, time) {
    var touchUi = WB.Touch.isActive();

    // Pause screen: hide the field entirely to prevent studying the letters.
    if (state === 'paused') {
      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, W, H);
      var pauseLines = [
        { text: 'PAUSED', font: 'bold 46px Consolas, monospace', color: '#9fe8ff', y: 240 },
        { text: 'カンニング防止のため画面を隠しています', font: '15px sans-serif', color: '#c0c8d0', y: 300 },
        { text: 'SCORE ' + score + '   LV ' + level, font: '18px Consolas, monospace', color: '#ffd166', y: 344 }
      ];
      if (!touchUi) {
        pauseLines.push({ text: 'P / ESC : 再開', font: 'bold 18px sans-serif', color: '#fff', y: 410 });
        pauseLines.push({ text: 'R : リスタート', font: 'bold 18px sans-serif', color: '#fff', y: 442 });
      }
      drawCenterText(ctx, pauseLines);
      drawMuteIndicator(ctx);
      WB.Touch.draw(ctx); // resume / restart tap buttons
      return;
    }

    WB.Background.draw(ctx, time);

    if (state === 'title') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);
      drawCenterText(ctx, [
        { text: 'WORD BOMBER', font: 'bold 46px Consolas, monospace', color: '#ffd166', y: 150 },
        { text: '- 英単語爆撃作戦 -', font: '18px sans-serif', color: '#9fe8ff', y: 192 },
        { text: 'お題の英単語の順番どおりに', font: '16px sans-serif', color: '#e8ecf0', y: 258 },
        { text: '文字砲台を爆撃せよ!', font: '16px sans-serif', color: '#e8ecf0', y: 282 },
        { text: '順番を間違えるとミス。虫食い(?)は推理しよう', font: '14px sans-serif', color: '#c0c8d0', y: 314 },
        { text: '砲台の反撃に当たると機体を1機失う(初期8機)', font: '14px sans-serif', color: '#ffb3b3', y: 340 },
        { text: touchUi ? 'ドラッグ: 移動    💣ボタン / 2本目の指: 爆撃' : '移動: ←→↑↓ / WASD    爆撃: SPACE / Z', font: '15px sans-serif', color: '#9fe8ff', y: 398 },
        { text: touchUi ? 'ポーズ: ⏸    ミュート: スピーカーアイコン' : 'ポーズ: P / ESC    ミュート: M', font: '15px sans-serif', color: '#9fe8ff', y: 424 },
        { text: (Math.floor(time * 2) % 2 === 0) ? (touchUi ? 'TAP TO START' : 'PRESS SPACE') : '', font: 'bold 24px Consolas, monospace', color: '#fff', y: 486 },
        { text: 'HI-SCORE ' + hiscore, font: '16px Consolas, monospace', color: '#ffd166', y: 548 }
      ]);
      drawMuteIndicator(ctx);
      WB.Touch.draw(ctx);
      return;
    }

    WB.Spawner.draw(ctx);
    WB.EnemyFire.draw(ctx);
    WB.Bombs.draw(ctx);

    // warp streaks: vertical speed lines while fast-forwarding
    if (state === 'playing' && warpTimer > 0) {
      var wa = Math.min(1, warpTimer / 0.4) * Math.min(1, (WARP_TIME - warpTimer) / 0.3 + 0.2);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.28 * wa).toFixed(3) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var s = 0; s < 14; s++) {
        var lx = Math.random() * W;
        var ly = Math.random() * H;
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx, ly + 50 + Math.random() * 110);
      }
      ctx.stroke();
      ctx.lineWidth = 1;
    }

    WB.Player.draw(ctx, time);
    WB.Hud.draw(ctx, {
      score: score, hiscore: hiscore, lives: lives, level: level,
      combo: combo, comboMult: comboMult
    });

    if (state === 'gameover') {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, W, H);
      drawCenterText(ctx, [
        { text: 'GAME OVER', font: 'bold 44px Consolas, monospace', color: '#ff5a5a', y: 240 },
        { text: 'SCORE ' + score, font: 'bold 24px Consolas, monospace', color: '#9fe8ff', y: 320 },
        { text: 'HI-SCORE ' + hiscore, font: '18px Consolas, monospace', color: '#ffd166', y: 358 },
        { text: touchUi ? 'TAP TO RETRY' : 'PRESS SPACE TO RETRY', font: 'bold 18px Consolas, monospace', color: '#fff', y: 440 }
      ]);
    }

    drawMuteIndicator(ctx);
    WB.Touch.draw(ctx);
  }

  return {
    update: update, draw: draw, loadHiscore: loadHiscore,
    getState: function () { return state; }
  };
})();
</script>
<script>
// Bootstrap: canvas setup and the main loop.
(function () {
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  WB.Input.init();
  WB.Touch.init();
  WB.Game.loadHiscore();
  WB.Background.reset();
  WB.WordGame.newWord(1); // so the HUD has a word even before the first game

  var last = 0;
  var time = 0;

  function frame(ts) {
    var dt = (ts - last) / 1000;
    last = ts;
    if (dt > 0.1) dt = 0.1; // tab-switch guard
    time += dt;

    WB.Game.update(dt);
    WB.Game.draw(ctx, time);
    WB.Input.endFrame();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(function (ts) {
    last = ts;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
